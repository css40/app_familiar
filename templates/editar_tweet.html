<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Editar publicación</title>
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/feed.css">
</head>
<body>
  <header class="topbar">
    <a class="icon-btn" href="/user_home" aria-label="Volver al inicio" title="Volver al inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="topbar-title">
      <h1>Editar publicación</h1>
      <span>Actualiza lo que escribiste</span>
    </div>
    
  </header>

  <main class="page narrow">
    <form method="POST" class="card form-stack">
      <div class="field">
        <label for="contenido">Contenido</label>
        <textarea id="contenido" name="contenido" required placeholder="Escribe tu publicación...">{{ contenido }}</textarea>
        <span class="muted">Tip: puedes usar @usuario para mencionar.</span>
      </div>

      <div class="actions">
        <a class="btn" href="/user_home">Cancelar</a>
        <button class="btn primary" type="submit">Guardar cambios</button>
      </div>
    </form>
  </main>
</body>
</html>
