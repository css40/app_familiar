<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Iniciar sesión</title>
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/auth.css">
</head>
<body class="auth-body">
  <main class="auth-page">
    <div class="auth-card card">
      <div class="auth-head">
        <img src="/static/login.png" alt="Logo" class="auth-logo">
        <h1>Bienvenido</h1>
        <p>Inicia sesión para continuar</p>
      </div>

      <form method="POST" class="form-stack">
        <div class="field">
          <label for="email">Correo</label>
          <input id="email" type="email" name="email" placeholder="correo@ejemplo.com" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" type="password" name="password" placeholder="Tu contraseña" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn primary block">Iniciar sesión</button>
      </form>

      <p class="auth-foot">¿No tienes cuenta? <a href="/register">Regístrate</a></p>
    </div>
  </main>
</body>
</html>
