<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Editar integrante</title>
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
  <header class="topbar">
    <a class="icon-btn" href="/members" aria-label="Volver a integrantes" title="Volver a integrantes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="topbar-title">
      <h1>Editar integrante</h1>
      <span>Actualiza la información del usuario</span>
    </div>
    
  </header>

  <main class="page">
    <form method="POST" enctype="multipart/form-data" class="card">
      <div class="form-grid">
        <div class="field">
          <label for="nombre">Nombre</label>
          <input id="nombre" type="text" name="nombre" value="{{ integrante[1] }}" required>
        </div>

        <div class="field">
          <label for="apellido">Apellido</label>
          <input id="apellido" type="text" name="apellido" value="{{ integrante[2] }}" required>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" name="email" value="{{ integrante[3] }}" required>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" type="password" name="password" value="{{ integrante[4] }}" required>
        </div>

        <div class="field">
          <label for="fecha_nac">Fecha de nacimiento</label>
          <input id="fecha_nac" type="date" name="fecha_nac" value="{{ integrante[5] }}">
        </div>

        <div class="field">
          <label for="estado_civil">Estado civil</label>
          <input id="estado_civil" type="text" name="estado_civil" value="{{ integrante[11] or '' }}">
        </div>

        <div class="field">
          <label for="municipio">Municipio</label>
          <input id="municipio" type="text" name="municipio" value="{{ integrante[6] }}">
        </div>

        <div class="field">
          <label for="pais">País</label>
          <input id="pais" type="text" name="pais" value="{{ integrante[7] }}">
        </div>

        <div class="field">
          <label for="telefono">Teléfono</label>
          <input id="telefono" type="text" name="telefono" value="{{ integrante[9] or '' }}">
        </div>

        <div class="field">
          <label for="direccion">Dirección</label>
          <input id="direccion" type="text" name="direccion" value="{{ integrante[10] or '' }}">
        </div>

        <div class="field full">
          <label for="bio">Bio</label>
          <textarea id="bio" name="bio" rows="4">{{ integrante[12] or '' }}</textarea>
        </div>

        <div class="field full">
          <label>Foto</label>
          <div class="photo-row">
            {% if integrante[8] %}
              <img class="avatar lg" src="/{{ integrante[8].replace('\\','/') }}" alt="Foto actual">
            {% endif %}
            <label class="file">📷 <span class="file-label">Elegir nueva foto</span><input type="file" name="foto"></label>
          </div>
        </div>

        <div class="toggle-field">
          <span>Administrador</span>
          <label class="switch"><input type="checkbox" name="is_admin" aria-label="Administrador" {% if integrante[14] == 1 %}checked{% endif %}><span class="slider"></span></label>
        </div>

        <div class="toggle-field">
          <span>Activo</span>
          <label class="switch"><input type="checkbox" name="activo" aria-label="Activo" {% if integrante[13] == 1 %}checked{% endif %}><span class="slider"></span></label>
        </div>
      </div>

      <div class="actions">
        <a href="/members" class="btn">Cancelar</a>
        <button type="submit" class="btn primary">Guardar cambios</button>
      </div>
    </form>
  </main>
  <script src="/static/ui.js"></script>
</body>
</html>
