<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Buscar usuario</title>
  <link rel="stylesheet" href="/static/base.css">
</head>
<body>
  <header class="topbar">
    <a class="icon-btn" href="/inbox" aria-label="Volver a chats" title="Volver a chats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="topbar-title">
      <h1>Buscar usuario</h1>
      <span>Encuentra gente y chatea</span>
    </div>
    
  </header>

  <main class="page">
    <form method="GET" action="/buscar_usuario" class="tools">
      <div class="search-wrap">
        <span class="search-ico">🔍</span>
        <input type="search" name="q" value="{{ q }}" placeholder="Nombre, apellido o correo" autocomplete="off">
      </div>
      <button class="btn primary" type="submit">Buscar</button>
    </form>

    {% if q and resultados|length == 0 %}
      <div class="card empty-box">
        <div class="empty-ico">🫥</div>
        <h2>Sin resultados</h2>
        <p>No hay resultados para “{{ q }}”.</p>
      </div>
    {% endif %}

    <div class="list">
      {% for u in resultados %}
        <div class="list-item">
          <img class="avatar" src="/{{ u[4] if u[4] else 'static/default_user.png' }}" alt="">

          <div class="list-body">
            <div class="list-title">{{ u[1] }} {{ u[2] }}</div>
            <div class="list-sub">{{ u[3] }}</div>
            <div class="list-actions">
              <a class="btn small primary" href="/dm/{{ u[0] }}">💬 Chatear</a>
              <a class="btn small" href="/member/{{ u[0] }}">Ver perfil</a>
            </div>
          </div>
        </div>
      {% endfor %}
    </div>
  </main>
</body>
</html>
