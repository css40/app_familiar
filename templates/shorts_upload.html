<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Subir short</title>
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/shorts.css">
</head>
<body>
  <header class="topbar">
    <a class="icon-btn" href="/shorts" aria-label="Volver a shorts" title="Volver a shorts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="topbar-title">
      <h1>Subir short</h1>
      <span>Máx. 25 MB · 10–30 s · mp4, webm o mov</span>
    </div>
    
  </header>

  <main class="page narrow">
    <form method="POST" enctype="multipart/form-data" class="card form-stack">

      <!-- GRUPO -->
      <div class="field">
        <label for="grupo_id">Grupo</label>
        <select id="grupo_id" name="grupo_id" required>
          {% for g in grupos %}
            <option value="{{ g[0] }}">{{ g[1] }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- VIDEO -->
      <div class="field">
        <label>Video</label>

        <div class="drop file-picker">
          <!-- input real (oculto) -->
          <input
            type="file"
            id="videoInput"
            name="video"
            accept="video/mp4,video/webm,video/quicktime"
            required
          >

          <button
            type="button"
            class="btn file-btn"
            onclick="document.getElementById('videoInput').click()"
          >
            🎬 Seleccionar video
          </button>

          <div class="file-name" id="fileName">
            Ningún video seleccionado
          </div>

          <!-- PREVIEW -->
          <div class="video-preview hidden" id="previewWrap">
            <video id="videoPreview" playsinline></video>

            <button
              type="button"
              class="preview-play"
              id="previewPlay"
              aria-label="Reproducir vista previa"
            >
              ▶️
            </button>
          </div>

          <!-- INFO -->
          <div class="video-info" id="videoInfo"></div>

          <!-- ERROR -->
          <div class="video-error" id="videoError"></div>

          <!-- PROGRESO -->
          <div class="upload-progress hidden" id="uploadProgress">
            <div class="bar">
              <div class="fill" id="uploadFill"></div>
            </div>
            <div class="percent" id="uploadPercent">0%</div>
          </div>
        </div>
      </div>

      <!-- DESCRIPCIÓN -->
      <div class="field">
        <label for="descripcion">Descripción <span class="muted">(opcional)</span></label>
        <input
          id="descripcion"
          type="text"
          name="descripcion"
          maxlength="120"
          placeholder="Ej: cumpleaños 🎂"
        >
        <span class="muted">Tip: un video vertical y cortito carga más rápido.</span>
      </div>

      <!-- ACCIONES -->
      <div class="actions">
        <a class="btn" href="/shorts">Cancelar</a>
        <button class="btn primary" type="submit">⬆️ Subir</button>
      </div>

    </form>
  </main>

<script>
  const input = document.getElementById("videoInput");
  const fileName = document.getElementById("fileName");
  const previewWrap = document.getElementById("previewWrap");
  const video = document.getElementById("videoPreview");
  const info = document.getElementById("videoInfo");
  const errorBox = document.getElementById("videoError");
  const submitBtn = document.querySelector("button[type='submit']");
  const pickBtn = document.querySelector(".file-btn");

  const MAX_MB = 25;
  const MAX_SECONDS = 30;

  submitBtn.disabled = true;

  const playBtn = document.getElementById("previewPlay");

// toggle play preview
playBtn.addEventListener("click", ()=>{
  if (video.paused) {
    video.play();
    playBtn.classList.add("hidden");
  } else {
    video.pause();
    playBtn.classList.remove("hidden");
  }
});

video.addEventListener("pause", ()=>{
  playBtn.classList.remove("hidden");
});

video.addEventListener("play", ()=>{
  playBtn.classList.add("hidden");
});


  input.addEventListener("change", () => {
    resetUI();

    if (!input.files.length) return;

    const file = input.files[0];
    fileName.textContent = file.name;

    const sizeMB = (file.size / (1024 * 1024)).toFixed(2);

    // tamaño
    if (sizeMB > MAX_MB) {
      showError(`❌ El video pesa ${sizeMB}MB (máx ${MAX_MB}MB)`);
      return;
    }

    // preview
    const url = URL.createObjectURL(file);
    video.src = url;
    previewWrap.classList.remove("hidden");

    video.onloadedmetadata = () => {
      const duration = video.duration.toFixed(1);

      // duración
      if (duration > MAX_SECONDS) {
        showError(`❌ Dura ${duration}s (máx ${MAX_SECONDS}s)`);
        URL.revokeObjectURL(url);
        return;
      }

      info.innerHTML = `
        ⏱️ Duración: <b>${duration}s</b> ·
        📦 Tamaño: <b>${sizeMB} MB</b>
      `;

      submitBtn.disabled = false;
    };
  });

  function showError(msg){
    errorBox.textContent = msg;
    pickBtn.classList.add("error");
    submitBtn.disabled = true;
  }

  function resetUI(){
    previewWrap.classList.add("hidden");
    info.textContent = "";
    errorBox.textContent = "";
    pickBtn.classList.remove("error");
    submitBtn.disabled = true;
  }

  const form = document.querySelector("form");
const progressWrap = document.getElementById("uploadProgress");
const progressFill = document.getElementById("uploadFill");
const progressText = document.getElementById("uploadPercent");

form.addEventListener("submit", (e)=>{
  e.preventDefault();

  const fd = new FormData(form);
  const xhr = new XMLHttpRequest();

  xhr.open("POST", window.location.href);

  progressWrap.classList.remove("hidden");
  submitBtn.disabled = true;

  xhr.upload.onprogress = (e)=>{
    if (!e.lengthComputable) return;
    const percent = Math.round((e.loaded / e.total) * 100);
    progressFill.style.width = percent + "%";
    progressText.textContent = percent + "%";
  };

  xhr.onload = ()=>{
    if (xhr.status === 200 || xhr.status === 302) {
      progressText.textContent = "✅ Subido";
      window.location.href = "/shorts";
    } else {
      showError("❌ Error al subir el video");
      submitBtn.disabled = false;
    }
  };

  xhr.onerror = ()=>{
    showError("❌ Error de red");
    submitBtn.disabled = false;
  };

  xhr.send(fd);
});

</script>
</body>
</html>
