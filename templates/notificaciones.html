<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Notificaciones</title>
  <link rel="stylesheet" href="/static/base.css">
</head>
<body>
  <header class="topbar">
    <a class="icon-btn" href="/user_home" aria-label="Volver al inicio" title="Volver al inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="topbar-title">
      <h1>Notificaciones</h1>
      <span>Tu actividad reciente</span>
    </div>
    
  </header>

  <main class="page">
    <div class="page-head">
      <h1>Notificaciones</h1>
      <form action="/notificaciones/marcar_todo" method="POST">
        <button class="btn small" type="submit">✓ Marcar como leídas</button>
      </form>
    </div>

    {% if notificaciones|length == 0 %}
      <div class="card empty-box">
        <div class="empty-ico">🔔</div>
        <h2>Todo al día</h2>
        <p>No tienes notificaciones todavía.</p>
      </div>
    {% else %}
      <div class="list">
        {% for n in notificaciones %}
        <div class="list-item noti" id="noti-{{ n[0] }}">
          <img class="avatar" src="/{{ n[5] if n[5] else 'static/default_user.png' }}" alt="">

          <div class="list-body">
            <div><b>{{ n[3] }} {{ n[4] }}</b> {{ n[1] }}</div>

            <!-- guardamos el timestamp real en data-time -->
            <div class="list-sub noti-time" data-time="{{ n[2] }}">{{ n[2] }}</div>
          </div>

          <button class="btn small danger" type="button" aria-label="Eliminar notificación" onclick="eliminarNoti({{ n[0] }})">Eliminar</button>
        </div>
        {% endfor %}
      </div>
    {% endif %}
  </main>

<script>
  function parseSqliteDatetime(s){
    // "2026-02-04 19:50:27" -> "2026-02-04T19:50:27"
    if(!s) return null;
    return new Date(s.replace(" ", "T"));
  }

  function timeAgo(date){
    const sec = Math.floor((Date.now() - date.getTime()) / 1000);
    if (sec < 5) return "ahorita";
    if (sec < 60) return `hace ${sec}s`;
    const min = Math.floor(sec/60);
    if (min < 60) return `hace ${min} min`;
    const hr = Math.floor(min/60);
    if (hr < 24) return `hace ${hr} h`;
    const d = Math.floor(hr/24);
    return `hace ${d} días`;
  }

  // convierte fechas a "hace X"
  document.querySelectorAll(".noti-time").forEach(el=>{
    const dt = parseSqliteDatetime(el.dataset.time);
    if(dt) el.textContent = timeAgo(dt);
  });

  async function eliminarNoti(id){
    const res = await fetch(`/notificaciones/${id}/eliminar`, { method:"POST" });
    if(res.ok){
      const card = document.getElementById(`noti-${id}`);
      if(card) card.remove();
    }
  }
</script>
</body>
</html>
