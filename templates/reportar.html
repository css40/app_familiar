<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Reportar un problema</title>
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/profile.css">
</head>
<body>
  <header class="topbar">
    <a class="icon-btn" href="/user_home" aria-label="Volver al inicio" title="Volver al inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="topbar-title">
      <h1>Reportar un problema</h1>
      <span>Cuéntanos qué falla</span>
    </div>
    
  </header>

  <main class="page narrow">
    <form method="POST" class="card form-stack">
      <div class="field">
        <label for="titulo">Título</label>
        <input id="titulo" type="text" name="titulo" placeholder="Resumen breve" required />
      </div>

      <div class="field">
        <label for="tipo">Tipo</label>
        <select id="tipo" name="tipo">
          <option value="error">Error técnico</option>
          <option value="mejora">Mejora</option>
          <option value="otro">Otro</option>
        </select>
      </div>

      <div class="field">
        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" name="descripcion" rows="6" placeholder="Cuenta qué sucede, con el mayor detalle posible" required></textarea>
      </div>

      <div class="actions">
        <a class="btn" href="/user_home">Cancelar</a>
        <button type="submit" class="btn primary">Enviar reporte</button>
      </div>
    </form>
  </main>
</body>
</html>
