<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Integrantes</title>
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
  <header class="topbar">
    <a class="icon-btn" href="/admin_home" aria-label="Volver al panel" title="Volver al panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="topbar-title">
      <h1>Integrantes</h1>
      <span>Administración de usuarios</span>
    </div>
    <div class="top-actions"><a class="btn small primary" href="/add_member">+ Agregar</a></div>
  </header>

  <main class="page wide">
    <section class="card">
      <div class="table-wrap">
        <table class="rtable members-table">
          <thead>
            <tr>
              <th>Foto</th>
              <th>Nombre</th>
              <th>Email</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            {% for i in integrantes %}
            <tr>
              <td class="cell-photo">
                {% if i[5] %}
                  <img src="/{{ i[5].replace('\\','/') }}" class="avatar" alt="">
                {% else %}
                  <img src="/static/default_user.png" class="avatar" alt="">
                {% endif %}
              </td>
              <td data-label="Nombre"><strong>{{ i[1] }} {{ i[2] }}</strong></td>
              <td data-label="Email" class="email">{{ i[3] }}</td>
              <td class="actions-cell">
                <a href="/edit_member/{{ i[0] }}" class="btn small">Editar</a>
                <a href="/delete_member/{{ i[0] }}"
                   class="btn danger small"
                   onclick="return confirm('¿Seguro que quieres eliminar este integrante?')">
                  Eliminar
                </a>
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
