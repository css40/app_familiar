<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Chat - {{ grupo_nombre }}</title>
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/chat.css">
</head>
<body class="chat-body chat-group">
  <header class="topbar">
    <a class="icon-btn" href="/grupo/{{grupo_id}}" aria-label="Volver al grupo" title="Volver al grupo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="topbar-title">
      <h1>{{ grupo_nombre }}</h1>
      <span>Chat del grupo</span>
    </div>
    
  </header>

  <main class="chat-page">
    <div id="msgs" class="msgs"></div>
  </main>

  <div class="chat-bar">
    <form id="sendForm" class="chat-form">
      <label class="chat-attach" for="file" title="Enviar imagen" aria-label="Enviar imagen"></label>
      <input id="file" type="file" name="media" accept="image/*">
      <input id="txt" class="chat-input" type="text" name="mensaje" placeholder="Escribe un mensaje..." autocomplete="off">
      <button type="submit" class="chat-send" aria-label="Enviar">Enviar</button>
    </form>
  </div>

<script>
  let lastId = 0;
  let meId = null;
  const box = document.getElementById("msgs");

  function escapeHtml(s){
    return (s||"").replaceAll("&","&amp;").replaceAll("<","&lt;")
                  .replaceAll(">","&gt;").replaceAll('"',"&quot;")
                  .replaceAll("'","&#039;");
  }

  function addMsg(m){
    const isMe = (m.user_id === meId);
    const row = document.createElement("div");
    row.className = "row " + (isMe ? "me" : "him");

    if(!isMe){
      const av = document.createElement("img");
      av.className = "avatar";
      av.src = m.avatar;
      row.appendChild(av);
    }

    const bub = document.createElement("div");
    bub.className = "bubble " + (isMe ? "me" : "him");

    // nombre arriba (tipo WhatsApp en grupos)
    if(!isMe){
      const nm = document.createElement("div");
      nm.className = "name";
      nm.innerHTML = escapeHtml(m.nombre);
      bub.appendChild(nm);
    }

    if(m.mensaje){
      const tx = document.createElement("div");
      tx.innerHTML = escapeHtml(m.mensaje);
      bub.appendChild(tx);
    }

    if(m.media){
      const im = document.createElement("img");
      im.className = "media";
      im.src = m.media;
      bub.appendChild(im);
    }

    const tm = document.createElement("div");
    tm.className = "time";
    tm.innerHTML = escapeHtml(m.fecha);
    bub.appendChild(tm);

    row.appendChild(bub);

    if(isMe){
      const av = document.createElement("img");
      av.className = "avatar";
      av.src = m.avatar; // tu avatar también, opcional
      row.appendChild(av);
    }

    box.appendChild(row);
    lastId = Math.max(lastId, m.id);
  }

  async function poll(){
    try{
      const res = await fetch(`/api/grupo/{{grupo_id}}/mensajes?after_id=${lastId}`);
      if(!res.ok) return;

      const data = await res.json();
      if(meId === null) meId = data.me;

      (data.messages || []).forEach(addMsg);

      if((data.messages || []).length){
        window.scrollTo(0, document.body.scrollHeight);
      }
    }catch(e){}
  }

  // enviar sin recargar
  document.getElementById("sendForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);

    // evita mandar vacío
    const txt = (document.getElementById("txt").value || "").trim();
    const file = document.getElementById("file").files[0];
    if(!txt && !file) return;

    const res = await fetch(`/api/grupo/{{grupo_id}}/enviar`, { method:"POST", body: fd });
    if(res.ok){
      document.getElementById("txt").value = "";
      document.getElementById("file").value = "";
      poll(); // refresca rápido
    }
  });

  poll();
  setInterval(poll, 1500);
</script>
</body>
</html>
