<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Agregar integrante</title>
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
  <header class="topbar">
    <a class="icon-btn" href="/admin_home" aria-label="Volver al panel" title="Volver al panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="topbar-title">
      <h1>Agregar integrante</h1>
      <span>Registro de un nuevo miembro</span>
    </div>
    
  </header>

  <main class="page">
    <form class="card" method="POST" enctype="multipart/form-data">
      <div class="form-grid">
        <div class="field">
          <label for="nombre">Nombre</label>
          <input id="nombre" type="text" name="nombre" required>
        </div>

        <div class="field">
          <label for="apellido">Apellido</label>
          <input id="apellido" type="text" name="apellido" required>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" name="email" required>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" type="password" name="password" required>
        </div>

        <div class="field">
          <label for="fecha_nac">Fecha de nacimiento</label>
          <input id="fecha_nac" type="date" name="fecha_nac">
        </div>

        <div class="field">
          <label for="estado_civil">Estado civil</label>
          <input id="estado_civil" type="text" name="estado_civil">
        </div>

        <div class="field">
          <label for="municipio">Municipio</label>
          <input id="municipio" type="text" name="municipio">
        </div>

        <div class="field">
          <label for="pais">País</label>
          <input id="pais" type="text" name="pais">
        </div>

        <div class="field">
          <label for="telefono">Teléfono</label>
          <input id="telefono" type="text" name="telefono">
        </div>

        <div class="field full">
          <label for="bio">Biografía</label>
          <textarea id="bio" name="bio" rows="3" placeholder="Pequeña biografía..."></textarea>
        </div>

        <div class="field full">
          <label>Foto de perfil</label>
          <label class="file">📷 <span class="file-label">Elegir foto</span><input type="file" name="foto"></label>
        </div>

        <div class="toggle-field">
          <span>Administrador</span>
          <label class="switch"><input type="checkbox" name="is_admin" aria-label="Administrador"><span class="slider"></span></label>
        </div>

        <div class="toggle-field">
          <span>Activo</span>
          <label class="switch"><input type="checkbox" name="activo" aria-label="Activo" checked><span class="slider"></span></label>
        </div>
      </div>

      <div class="actions">
        <a href="/admin_home" class="btn">Cancelar</a>
        <button type="submit" class="btn primary">Guardar integrante</button>
      </div>
    </form>
  </main>
  <script src="/static/ui.js"></script>
</body>
</html>
