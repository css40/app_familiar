<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Registro</title>
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/auth.css">
</head>
<body class="auth-body">
  <main class="auth-page">
    <div class="auth-card card">
      <div class="auth-head">
        <img src="/static/login.png" alt="Logo" class="auth-logo">
        <h1>Crear cuenta</h1>
        <p>Regístrate y personaliza tu perfil</p>
      </div>

      {% if error %}
        <div class="alert" role="alert">{{ error }}</div>
      {% endif %}

      <form method="POST" enctype="multipart/form-data" class="form-stack">
        <div class="form-grid">
          <div class="field">
            <label for="nombre">Nombre</label>
            <input id="nombre" type="text" name="nombre" autocomplete="given-name" required>
          </div>
          <div class="field">
            <label for="apellido">Apellido</label>
            <input id="apellido" type="text" name="apellido" autocomplete="family-name" required>
          </div>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" name="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" type="password" name="password" autocomplete="new-password" required>
        </div>
        <div class="field">
          <label>Foto de perfil <span class="muted">(opcional)</span></label>
          <label class="file">📷 <span class="file-label">Elegir foto</span><input type="file" name="foto" accept="image/*"></label>
        </div>
        <button type="submit" class="btn primary block">Registrarme</button>
      </form>

      <p class="auth-foot">¿Ya tienes cuenta? <a href="/login">Inicia sesión</a></p>
    </div>
  </main>
  <script src="/static/ui.js"></script>
</body>
</html>
