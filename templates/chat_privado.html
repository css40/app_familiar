<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Chat con {{other_name}}</title>
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/chat.css">
</head>
<body class="chat-body chat-legacy">
  <header class="topbar">
    <a class="icon-btn" href="/inbox" aria-label="Volver a chats" title="Volver a chats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="topbar-title">
      <h1>{{other_name}}</h1>
      <span>Chat privado</span>
    </div>
    
  </header>

  <main class="chat-page">
    <div id="msgs" class="msgs"></div>
  </main>

  <div class="chat-bar">
    <form method="POST" class="chat-form">
      <input name="mensaje" id="inputMsg" class="chat-input" autocomplete="off" placeholder="Escribe un mensaje...">
      <button class="chat-send">Enviar</button>
    </form>
  </div>

<script>
  let lastId = 0;
  const msgs = document.getElementById("msgs");
  const meId = {{ session['user_id'] }};

  function addMsg(m){
    const div = document.createElement("div");
    div.className = "msg " + (m.emisor_id === meId ? "me" : "him");
    div.innerHTML = `<div>${escapeHtml(m.mensaje)}</div>
                     <div class="meta">${escapeHtml(m.fecha)}</div>`;
    msgs.appendChild(div);
    lastId = Math.max(lastId, m.id);
  }

  async function poll(){
    try{
      const res = await fetch(`/api/privado/{{other_id}}/mensajes?after_id=${lastId}`);
      if(!res.ok) return;
      const data = await res.json();
      (data.messages || []).forEach(addMsg);
      if((data.messages || []).length) window.scrollTo(0, document.body.scrollHeight);
    }catch(e){}
  }

  function escapeHtml(s){
    return (s||"").replaceAll("&","&amp;").replaceAll("<","&lt;")
                  .replaceAll(">","&gt;").replaceAll('"',"&quot;")
                  .replaceAll("'","&#039;");
  }

  poll();
  setInterval(poll, 1500);
</script>
</body>
</html>
